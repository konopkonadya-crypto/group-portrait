name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 1. Show files
        shell: pwsh
        run: Get-ChildItem -Recurse -Depth 1 | Select-Object FullName

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 2. Install libraries
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

  
      - name: 4. Build exe
        shell: pwsh
        run: python -m PyInstaller --noconfirm GroupPortrait.spec

      - name: 5. Zip
        shell: pwsh
        run: Compress-Archive -Path dist/GroupPortrait/* -DestinationPath GroupPortrait-windows.zip

      - name: 6. Upload
        uses: actions/upload-artifact@v4
        with:
          name: GroupPortrait-windows
          path: GroupPortrait-windows.zip
